[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deca-experiments"
version = "3.0.0"
description = "Reproducible additive and symmetry-resolved observable-contrast research"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Rongzhou (Lachlan) Chen"},
]
requires-python = ">=3.10"
dependencies = [
  "cvxpy>=1.6,<2",
  "matplotlib>=3.8,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
quantum = [
  "qiskit~=2.5.0",
  "qiskit-aer~=0.17",
]
test = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = [".", "run1"]
include = ["aoc*", "deca*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["run1/tests", "run2/tests", "run3/tests"]
